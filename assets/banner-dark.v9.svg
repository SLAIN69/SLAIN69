<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .bg { fill: #0b101a; }
      .window { fill: #0f1624; stroke: #1e3a5f; stroke-width: 2; rx: 6px; }
      .title-bar { fill: #111b2d; }
      .text-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #64b5f6; }
      .text-main { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #90caf9; }
      .text-green { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #69f0ae; }
      .text-cyan { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #4fc3f7; }
      .text-purple { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #b388ff; }
      .text-yellow { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #ffd54f; }
      .text-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #455a64; }
      
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      
      .screen-border { stroke: #1e3a5f; stroke-width: 1.5; fill: #090e17; rx: 4px; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; }
    </style>
  </defs>

  <!-- Fondo general -->
  <rect width="800" height="600" class="bg" />

  <!-- Ventana de Terminal Principal -->
  <g transform="translate(30, 25)">
    <!-- Cuerpo de la ventana -->
    <rect width="740" height="550" class="window" />
    
    <!-- Barra de título -->
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 734 0 A 6 6 0 0 1 740 6 L 740 34 L 0 34 Z" class="title-bar" />
    <line x1="0" y1="34" x2="740" y2="34" stroke="#1e3a5f" stroke-width="1" />
    
    <!-- Botones de la ventana (Estilo Mac) -->
    <circle cx="18" cy="17" r="5" class="dot-red" />
    <circle cx="34" cy="17" r="5" class="dot-yellow" />
    <circle cx="50" cy="17" r="5" class="dot-green" />
    
    <!-- Título de la ventana -->
    <text x="370" y="21" text-anchor="middle" class="text-title">vim profile.yml</text>

    <!-- Contenido de la Terminal -->
    <g transform="translate(20, 50)">
      
      <!-- Panel Izquierdo: Cyber-Pop Runtime -->
      <g transform="translate(0, 0)">
        <rect width="280" height="425" class="screen-border" />
        <text x="12" y="22" class="text-yellow" font-size="11" font-weight="bold">CYBER-POP RUNTIME</text>
        <text x="210" y="22" class="text-dim" font-size="10">SLAIN69 / ONLINE</text>
        
        <!-- Contenedor del Arte Vectorial -->
        <g transform="translate(15, 35)">
          <rect width="250" height="345" fill="#070b12" stroke="#1a2d42" />
          
          <!-- Estrellas / Píxeles de fondo -->
          <rect x="220" y="30" width="2" height="2" fill="#fff" opacity="0.6" />
          <rect x="180" y="60" width="1.5" height="1.5" fill="#4fc3f7" opacity="0.8" />
          <rect x="230" y="90" width="2" height="2" fill="#fff" opacity="0.4" />
          <rect x="80" y="80" width="1.5" height="1.5" fill="#fff" opacity="0.5" />

          <!-- Sol Cyberpunk -->
          <g transform="translate(125, 145)">
            <circle cx="0" cy="0" r="65" fill="#29b6f6" />
            <rect x="-70" y="10" width="140" height="4" fill="#070b12" />
            <rect x="-70" y="22" width="140" height="7" fill="#070b12" />
            <rect x="-70" y="35" width="140" height="11" fill="#070b12" />
            <rect x="-70" y="50" width="140" height="15" fill="#070b12" />
          </g>

          <!-- Ondas inferiores -->
          <path d="M 15 270 Q 75 250 135 275 T 235 270" stroke="#69f0ae" stroke-width="2.5" fill="none" />
          <path d="M 15 285 Q 75 265 135 290 T 235 285" stroke="#4fc3f7" stroke-width="1.5" fill="none" opacity="0.7" />
        </g>

        <text x="12" y="412" class="text-dim" font-size="10">status: estudiante ing. sistemas</text>
      </g>

      <!-- Panel Derecho: Editor YAML -->
      <g transform="translate(300, 0)">
        <rect width="420" height="425" fill="#070b12" stroke="#1e3a5f" rx="4px" />
        
        <rect x="1" y="1" width="418" height="25" fill="#0c1322" />
        <text x="12" y="17" class="text-dim" font-size="10">profile.yml [YAML]</text>
        <text x="360" y="17" class="text-dim" font-size="10">@SLAIN69</text>
        <line x1="1" y1="26" x2="419" y2="26" stroke="#1e3a5f" stroke-width="1" />

        <g transform="translate(12, 20)">
          <g class="text-dim" font-size="11">
            <text x="0" y="30">1</text><text x="0" y="50">2</text><text x="0" y="70">3</text>
            <text x="0" y="90">4</text><text x="0" y="110">5</text><text x="0" y="130">6</text>
            <text x="0" y="150">7</text><text x="0" y="170">8</text><text x="0" y="190">9</text>
            <text x="0" y="210">10</text><text x="0" y="230">11</text><text x="0" y="250">12</text>
            <text x="0" y="270">13</text><text x="0" y="290">14</text><text x="0" y="310">15</text>
          </g>

          <g transform="translate(25, 0)">
            <text x="0" y="30" class="text-yellow">profile:</text>
            <text x="15" y="50" class="text-green">subject: <tspan class="text-main">Elmer Quispe (SLAIN69)</tspan></text>
            <text x="15" y="70" class="text-green">role: <tspan class="text-cyan">Técnico Informático</tspan></text>
            <text x="15" y="90" class="text-green">origin: <tspan class="text-main">Huancayo, Perú</tspan></text>
            <text x="15" y="110" class="text-green">mission: <tspan class="text-main">administrar redes y desarrollar backend</tspan></text>
            <text x="15" y="130" class="text-green">status: <tspan class="text-purple">Estudiante Ing. de Sistemas · U. Continental</tspan></text>
            <text x="15" y="150" class="text-yellow">stack:</text>
            <text x="30" y="170" class="text-cyan">networking: <tspan class="text-main">Cisco · Linux · Windows Server</tspan></text>
            <text x="30" y="190" class="text-cyan">databases: <tspan class="text-main">SQL Server · MySQL · MariaDB</tspan></text>
            <text x="30" y="210" class="text-cyan">backend: <tspan class="text-main">Python · Java · Node.js</tspan></text>
            <text x="30" y="230" class="text-cyan">hardware_iot: <tspan class="text-main">Arduino</tspan></text>
            <text x="15" y="250" class="text-yellow">contact:</text>
            <text x="30" y="270" class="text-purple">github: <tspan class="text-main">SLAIN69</tspan></text>
            <text x="30" y="290" class="text-purple">timezone: <tspan class="text-main">UTC-5 · Huancayo</tspan></text>
            
            <rect x="30" y="298" width="8" height="14" fill="#69f0ae" class="cursor" />
          </g>
        </g>
      </g>

      <!-- Barra de estado inferior -->
      <g transform="translate(0, 435)">
        <rect width="700" height="22" fill="#111b2d" rx="2px" />
        <text x="10" y="15" class="text-dim"><tspan fill="#070b12" font-weight="bold" style="background-color:#69f0ae"> NORMAL </tspan></text>
        <text x="75" y="15" class="text-main" font-size="10">profile.yml</text>
        <text x="430" y="15" class="text-dim" font-size="10">[utf-8]</text>
        <text x="590" y="15" class="text-dim" font-size="10">15L, 100% 15:1</text>
      </g>

    </g>
  </g>
</svg>
