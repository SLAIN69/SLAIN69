<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .bg { fill: #0b1019; }
      .window { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6px; }
      .title-bar { fill: #21262d; }
      .text-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #8b949e; }
      .text-main { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #c9d1d9; }
      .text-green { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #56d364; }
      .text-cyan { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #39c5cf; }
      .text-purple { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #d2a8ff; }
      .text-yellow { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #e3b341; }
      .text-dim { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #484f58; }
      
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      
      .screen-border { stroke: #30363d; stroke-width: 1; fill: #090d16; rx: 4px; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; }
    </style>
  </defs>

  <!-- Fondo general -->
  <rect width="900" height="480" class="bg" />

  <!-- Ventana de Terminal Principal -->
  <g transform="translate(25, 20)">
    <rect width="850" height="440" class="window" />
    
    <!-- Barra de título -->
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 844 0 A 6 6 0 0 1 850 6 L 850 32 L 0 32 Z" class="title-bar" />
    <line x1="0" y1="32" x2="850" y2="32" stroke="#30363d" stroke-width="1" />
    
    <!-- Botones de la ventana (Estilo Mac) -->
    <circle cx="16" cy="16" r="5" class="dot-red" />
    <circle cx="32" cy="16" r="5" class="dot-yellow" />
    <circle cx="48" cy="16" r="5" class="dot-green" />
    
    <!-- Título de la ventana -->
    <text x="425" y="20" text-anchor="middle" class="text-title">vim profile.yml</text>

    <!-- Contenido Interior -->
    <g transform="translate(20, 48)">
      
      <!-- Panel Izquierdo: VISUAL.MAP con el Logotipo de Linux (Estilo Puntitos) -->
      <g transform="translate(0, 0)">
        <rect width="250" height="365" class="screen-border" />
        <text x="12" y="20" class="text-dim">VISUAL.MAP</text>
        <text x="175" y="20" class="text-dim">300x340 / 1-BIT</text>
        
        <!-- Marco interior del arte tramado -->
        <g transform="translate(15, 30)">
          <rect width="220" height="295" fill="#070a10" stroke="#1f242c" />
          
          <!-- Logotipo de Tux (Linux) simulado mediante matriz de puntos/tramado -->
          <g fill="#ff79c6" opacity="0.9">
            <!-- Cabeza y cuerpo central de Tux -->
            <circle cx="110" cy="100" r="2" /><circle cx="115" cy="100" r="2" /><circle cx="105" cy="100" r="2" />
            <circle cx="100" cy="108" r="2" /><circle cx="110" cy="108" r="2" /><circle cx="120" cy="108" r="2" />
            <circle cx="95" cy="116" r="2" /><circle cx="102" cy="116" r="2" /><circle cx="118" cy="116" r="2" /><circle cx="125" cy="116" r="2" />
            
            <!-- Silueta de Pinguino / Tux tramada -->
            <!-- Puntos decorativos imitando la textura punteada -->
            <circle cx="110" cy="130" r="1.5" /><circle cx="100" cy="135" r="1.5" /><circle cx="120" cy="135" r="1.5" />
            <circle cx="90" cy="145" r="1.5" /><circle cx="110" cy="145" r="1.5" /><circle cx="130" cy="145" r="1.5" />
            <circle cx="85" cy="155" r="1.5" /><circle cx="95" cy="155" r="1.5" /><circle cx="125" cy="155" r="1.5" /><circle cx="135" cy="155" r="1.5" />
            <circle cx="80" cy="165" r="1.5" /><circle cx="140" cy="165" r="1.5" />
            <circle cx="75" cy="180" r="1.5" /><circle cx="145" cy="180" r="1.5" />
            <circle cx="75" cy="195" r="1.5" /><circle cx="145" cy="195" r="1.5" />
            <circle cx="80" cy="210" r="1.5" /><circle cx="140" cy="210" r="1.5" />
            <!-- Base / Patas -->
            <circle cx="90" cy="230" r="1.5" /><circle cx="100" cy="230" r="1.5" />
            <circle cx="120" cy="230" r="1.5" /><circle cx="130" cy="230" r="1.5" />
          </g>
        </g>

        <!-- Barra inferior del visor izquierdo -->
        <text x="12" y="350" class="text-dim">PTS 18000 · FS/SERPENTINE</text>
      </g>

      <!-- Panel Derecho: Editor YAML con tus datos actualizados -->
      <g transform="translate(265, 0)">
        <rect width="565" height="365" fill="#090d16" stroke="#30363d" rx="3px" />
        
        <!-- Cabecera del buffer -->
        <rect x="1" y="1" width="563" height="24" fill="#11161d" />
        <text x="12" y="16" class="text-dim">profile.yml [YAML]</text>
        <text x="500" y="16" class="text-dim">@SLAIN69</text>
        <line x1="1" y1="24" x2="564" y2="24" stroke="#30363d" stroke-width="1" />

        <!-- Números de línea y Código -->
        <g transform="translate(12, 12)">
          <!-- Números de línea -->
          <g class="text-dim">
            <text x="0" y="25">1</text><text x="0" y="42">2</text><text x="0" y="59">3</text>
            <text x="0" y="76">4</text><text x="0" y="93">5</text><text x="0" y="110">6</text>
            <text x="0" y="127">7</text><text x="0" y="144">8</text><text x="0" y="161">9</text>
            <text x="0" y="178">10</text><text x="0" y="195">11</text><text x="0" y="212">12</text>
            <text x="0" y="229">13</text><text x="0" y="246">14</text><text x="0" y="263">15</text>
          </g>

          <!-- Contenido YAML -->
          <g transform="translate(25, 0)">
            <text x="0" y="25" class="text-yellow">profile:</text>
            <text x="12" y="42" class="text-green">subject: <tspan class="text-main">Elmer Quispe (SLAIN69)</tspan></text>
            <text x="12" y="59" class="text-green">role: <tspan class="text-cyan">Técnico Informático</tspan></text>
            <text x="12" y="76" class="text-green">origin: <tspan class="text-main">Huancayo, Perú</tspan></text>
            <text x="12" y="93" class="text-green">mission: <tspan class="text-main">Administrar redes y desarrollar backend</tspan></text>
            <text x="12" y="110" class="text-green">status: <tspan class="text-purple">Estudiante Ing. Sistemas · U. Continental</tspan></text>
            <text x="12" y="127" class="text-yellow">stack:</text>
            <text x="24" y="144" class="text-cyan">networking: <tspan class="text-main">Cisco · Linux · Windows Server</tspan></text>
            <text x="24" y="161" class="text-cyan">databases: <tspan class="text-main">SQL Server · MySQL · MariaDB</tspan></text>
            <text x="24" y="178" class="text-cyan">backend: <tspan class="text-main">Python · Java · Node.js</tspan></text>
            <text x="24" y="195" class="text-cyan">hardware_iot: <tspan class="text-main">Arduino</tspan></text>
            <text x="12" y="212" class="text-yellow">contact:</text>
            <text x="24" y="229" class="text-purple">github: <tspan class="text-main">SLAIN69</tspan></text>
            <text x="24" y="246" class="text-purple">timezone: <tspan class="text-main">UTC-5 · Huancayo</tspan></text>
            
            <!-- Cursor parpadeante -->
            <rect x="24" y="254" width="7" height="12" fill="#56d364" class="cursor" />
          </g>
        </g>
      </g>

    </g>

    <!-- Barra de estado inferior Vim -->
    <g transform="translate(20, 415)">
      <rect width="810" height="22" fill="#21262d" rx="2px" />
      <text x="10" y="15" class="text-dim"><tspan fill="#0d1117" font-weight="bold" style="background-color:#56d364"> NORMAL </tspan></text>
      <text x="75" y="15" class="text-main">profile.yml</text>
      <text x="540" y="15" class="text-dim">[utf-8]</text>
      <text x="700" y="15" class="text-dim">15L, 100% 15:1</text>
    </g>

  </g>
</svg>

