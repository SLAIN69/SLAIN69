<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Perfil de Elmer Quispe (SLAIN69)</title>
  <desc id="desc">Perfil animado estilo terminal con un atardecer cyber-pop y los datos de Elmer Quispe.</desc>

  <defs>
    <!-- Sombra y brillo (colores azul/cyan para que combine con tu README) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B9BD7" flood-opacity=".25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Recorte del panel izquierdo para que nada se salga -->
    <clipPath id="visualClip"><rect x="49" y="124" width="390" height="414" rx="3"/></clipPath>
    <!-- Recorte del sol: solo la mitad de arriba, abajo van las franjas -->
    <clipPath id="sunClip"><circle cx="244" cy="290" r="90"/></clipPath>
  </defs>

  <!-- ===== VENTANA PRINCIPAL ===== -->
  <rect width="1180" height="610" rx="18" fill="#0B0F19"/>
  <rect x="13" y="13" width="1154" height="584" rx="13" fill="#0F1E3A" stroke="#1B9BD7" filter="url(#shadow)"/>
  <path d="M13 62H1167" stroke="#1B9BD7" opacity=".5"/>

  <!-- Botones de la ventana (rojo, amarillo, azul) -->
  <circle cx="38" cy="38" r="6" fill="#E03C31"/>
  <circle cx="59" cy="38" r="6" fill="#FFC83D"/>
  <circle cx="80" cy="38" r="6" fill="#1B9BD7"/>
  <text x="590" y="43" text-anchor="middle" fill="#8FA3BF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing=".4">vim profile.yml</text>

  <!-- ===== PANEL IZQUIERDO: ATARDECER ===== -->
  <rect x="35" y="88" width="418" height="472" rx="6" fill="#0B1428" stroke="#1B9BD7"/>
  <path d="M35 124H453" stroke="#1B9BD7" opacity=".5"/>
  <text x="49" y="111" fill="#5CF5C0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.2">CYBER-POP RUNTIME</text>
  <text x="438" y="111" text-anchor="end" fill="#8FA3BF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">SLAIN69 / ONLINE</text>

  <!-- Esquinas decorativas -->
  <path d="M49 141h12M49 141v12M439 141h-12M439 141v12M49 539h12M49 539v-12M439 539h-12M439 539h-12v-12" fill="none" stroke="#1B9BD7" opacity=".6"/>

  <g clip-path="url(#visualClip)">
    <!-- Estrellas que parpadean -->
    <g fill="#5CF5C0">
      <circle cx="100" cy="170" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="190" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="215" r="1"><animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="160" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="75" cy="250" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Sol -->
    <circle cx="244" cy="290" r="90" fill="#1B9BD7" filter="url(#glow)"/>
    <!-- Franjas oscuras sobre el sol (efecto retro) -->
    <g clip-path="url(#sunClip)" fill="#0B1428">
      <rect x="150" y="296" width="190" height="5"/>
      <rect x="150" y="314" width="190" height="8"/>
      <rect x="150" y="336" width="190" height="11"/>
      <rect x="150" y="360" width="190" height="14"/>
    </g>

    <!-- Olas animadas: se mueven suave de lado a lado -->
    <path d="M40 410 Q 100 380 160 410 T 280 410 T 400 410 T 520 410" fill="none" stroke="#5CF5C0" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M40 435 Q 100 415 160 435 T 280 435 T 400 435 T 520 435" fill="none" stroke="#1B9BD7" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-40 0;20 0;-40 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="58" y="551" fill="#8FA3BF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10">status: estudiante ing. sistemas</text>

  <!-- ===== PANEL DERECHO: profile.yml ===== -->
  <rect x="474" y="88" width="672" height="472" rx="6" fill="#0B1428" stroke="#1B9BD7"/>
  <path d="M474 124H1146" stroke="#1B9BD7" opacity=".5"/>
  <text x="490" y="111" fill="#5CF5C0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" letter-spacing=".5">profile.yml</text>
  <text x="580" y="111" fill="#8FA3BF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">[YAML]</text>

  <!-- Etiqueta con tu usuario -->
  <rect x="996" y="94" width="132" height="24" rx="12" fill="#1B9BD7" opacity=".18" stroke="#1B9BD7"/>
  <text x="1062" y="111" text-anchor="middle" fill="#1B9BD7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700">@SLAIN69</text>

  <!--
    Cada línea tiene: número (gris), clave (amarillo) y valor (blanco).
    Para editar un dato, cambia solo el texto del segundo <tspan>.
  -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">
    <!-- Bloque 1: profile -->
    <text x="506" y="148" text-anchor="end" fill="#8FA3BF" opacity=".5"> 1</text>
    <text x="525" y="148"><tspan fill="#5CF5C0" font-weight="700">profile:</tspan></text>

    <text x="506" y="169.5" text-anchor="end" fill="#8FA3BF" opacity=".5"> 2</text>
    <text x="542" y="169.5"><tspan fill="#FFC83D">subject: </tspan><tspan fill="#EAF2FF">Elmer Quispe (SLAIN69)</tspan></text>

    <text x="506" y="191" text-anchor="end" fill="#8FA3BF" opacity=".5"> 3</text>
    <text x="542" y="191"><tspan fill="#FFC83D">role: </tspan><tspan fill="#EAF2FF">Técnico Informático</tspan></text>

    <text x="506" y="212.5" text-anchor="end" fill="#8FA3BF" opacity=".5"> 4</text>
    <text x="542" y="212.5"><tspan fill="#FFC83D">origin: </tspan><tspan fill="#EAF2FF">Huancayo, Perú</tspan></text>

    <text x="506" y="234" text-anchor="end" fill="#8FA3BF" opacity=".5"> 5</text>
    <text x="542" y="234"><tspan fill="#FFC83D">mission: </tspan><tspan fill="#EAF2FF">administrar redes y desarrollar backend</tspan></text>

    <text x="506" y="255.5" text-anchor="end" fill="#8FA3BF" opacity=".5"> 6</text>
    <text x="542" y="255.5"><tspan fill="#FFC83D">status: </tspan><tspan fill="#EAF2FF">Estudiante Ing. de Sistemas · U. Continental</tspan></text>

    <!-- Bloque 2: stack -->
    <text x="506" y="277" text-anchor="end" fill="#8FA3BF" opacity=".5"> 7</text>
    <text x="525" y="277"><tspan fill="#5CF5C0" font-weight="700">stack:</tspan></text>

    <text x="506" y="298.5" text-anchor="end" fill="#8FA3BF" opacity=".5"> 8</text>
    <text x="542" y="298.5"><tspan fill="#FFC83D">networking: </tspan><tspan fill="#EAF2FF">Cisco · Linux · Windows Server</tspan></text>

    <text x="506" y="320" text-anchor="end" fill="#8FA3BF" opacity=".5"> 9</text>
    <text x="542" y="320"><tspan fill="#FFC83D">databases: </tspan><tspan fill="#EAF2FF">SQL Server · MySQL · MariaDB</tspan></text>

    <text x="506" y="341.5" text-anchor="end" fill="#8FA3BF" opacity=".5">10</text>
    <text x="542" y="341.5"><tspan fill="#FFC83D">backend: </tspan><tspan fill="#EAF2FF">Python · Java · Node.js</tspan></text>

    <text x="506" y="363" text-anchor="end" fill="#8FA3BF" opacity=".5">11</text>
    <text x="542" y="363"><tspan fill="#FFC83D">hardware_iot: </tspan><tspan fill="#EAF2FF">Arduino</tspan></text>

    <!-- Bloque 3: contact -->
    <text x="506" y="384.5" text-anchor="end" fill="#8FA3BF" opacity=".5">12</text>
    <text x="525" y="384.5"><tspan fill="#5CF5C0" font-weight="700">contact:</tspan></text>

    <text x="506" y="406" text-anchor="end" fill="#8FA3BF" opacity=".5">13</text>
    <text x="542" y="406"><tspan fill="#FFC83D">github: </tspan><tspan fill="#EAF2FF">SLAIN69</tspan></text>

    <text x="506" y="427.5" text-anchor="end" fill="#8FA3BF" opacity=".5">14</text>
    <text x="542" y="427.5"><tspan fill="#FFC83D">timezone: </tspan><tspan fill="#EAF2FF">UTC-5 · Huancayo</tspan></text>

    <!-- Cursor parpadeando al final, como en vim -->
    <text x="506" y="449" text-anchor="end" fill="#8FA3BF" opacity=".5">15</text>
  </g>
  <rect x="542" y="438" width="8" height="15" fill="#5CF5C0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== BARRA DE ESTADO (abajo) ===== -->
  <path d="M474 526H1146" stroke="#1B9BD7" opacity=".5"/>
  <rect x="475" y="527" width="670" height="32" fill="#0F1E3A"/>
  <rect x="485" y="533" width="72" height="20" rx="3" fill="#1B9BD7"/>
  <text x="521" y="547" text-anchor="middle" fill="#0B0F19" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">NORMAL</text>
  <text x="569" y="547" fill="#EAF2FF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600">profile.yml</text>
  <text x="740" y="547" fill="#8FA3BF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">[utf-8]</text>
  <text x="1134" y="547" text-anchor="end" fill="#8FA3BF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">15L  100%  15:1</text>
</svg>
