<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Elmer Quispe Merino — Técnico Informático</title>
  <desc id="desc">A cyber-pop styled terminal profile card with Elmer Quispe's location, mission and technical focus.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#1BA0D7"/>
      <stop offset="1" stop-color="#00599C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="390" rx="18" fill="#0A192F"/>
  <rect x="9" y="9" width="942" height="372" rx="13" fill="none" stroke="url(#sky)" stroke-width="2"/>
  <circle cx="35" cy="35" r="5" fill="#CC2927"/>
  <circle cx="54" cy="35" r="5" fill="#FCC624"/>
  <circle cx="73" cy="35" r="5" fill="#1BA0D7"/>
  <text x="98" y="41" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">SLAIN69  ·  profile shell  ·  online</text>
  <path d="M29 58H931" stroke="#1c2d42"/>

  <!-- Left Terminal -->
  <rect x="29" y="78" width="594" height="271" rx="9" fill="#112240" stroke="#1BA0D7" stroke-width="1.5"/>
  <text x="48" y="111" fill="#1BA0D7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">❯ whoami</text>
  <text x="48" y="143" fill="#CCD6F6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">elmer_quispe</text>
  <text x="195" y="143" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">—</text>
  <text x="220" y="143" fill="#64FFDA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Técnico Informático</text>

  <path d="M48 166H604" stroke="#1c2d42"/>
  <text x="48" y="196" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">context:</text>
  <text x="166" y="196" fill="#1BA0D7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Huancayo, Perú  🇵🇪</text>
  <text x="48" y="225" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">mission:</text>
  <text x="166" y="225" fill="#64FFDA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">administrar redes y desarrollar backend</text>

  <text x="48" y="267" fill="#1BA0D7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">❯ ls expertise/</text>
  <text x="48" y="299" fill="#FCC624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">networking/</text>
  <text x="190" y="299" fill="#CCD6F6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Cisco · Linux · Windows Server</text>
  <text x="48" y="326" fill="#FCC624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">backend_iot/</text>
  <text x="190" y="326" fill="#CCD6F6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Python · Java · Node.js · Arduino</text>

  <!-- Right Graphic -->
  <rect x="651" y="78" width="280" height="271" rx="9" fill="#112240" stroke="#1BA0D7" stroke-width="1.5"/>
