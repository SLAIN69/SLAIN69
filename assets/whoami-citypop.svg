  <circle cx="791" cy="203" r="56" fill="#1BA0D7" opacity=".95"/>
  <path d="M674 202H908M674 216H908M674 230H908M674 244H908M674 258H908" stroke="#112240" stroke-width="5" opacity=".9"/>
  <path d="M674 277C711 247 746 303 785 272S861 249 908 281" fill="none" stroke="#64FFDA" stroke-width="3" filter="url(#glow)"/>
